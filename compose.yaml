services:
  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    env_file: .env
    environment:
      NODE_ENV: production
    ports:
      - "3001:3001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    env_file: .env
    environment:
      NODE_ENV: production
      BACKEND_ORIGIN: http://backend:3001
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  checkout:
    build:
      context: .
      dockerfile: deploy/Dockerfile.checkout
    env_file: .env
    environment:
      NODE_ENV: production
      BACKEND_ORIGIN: http://backend:3001
      NEXT_PUBLIC_LAUNCHPAD_URL: http://frontend:3000
    ports:
      - "3002:3002"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
